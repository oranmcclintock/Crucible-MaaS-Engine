quarantine_failure_halt_threshold: 0.3
profiling_sample_size: 1000
fk_inference:
  min_stem_length_for_abbreviation_match: 3
  exact_match_confidence: 0.9
  abbreviation_match_confidence: 0.7

rules:
  - id: control_chars
    pattern: "[\x00-\x08\x0b\x0c\x0e-\x1f]"
    description: "Contains invisible control characters"
    severity: "warn"
  - id: text_currency
    currency_symbols: ["$", "£", "€"]
    currency_suffixes: ["USD", "EUR", "GBP"]
    description: "Currency value stored as text"
    severity: "warn"
  - id: non_numeric_in_numeric_col
    column_name_keywords: ["balance", "amount", "total", "price", "qty", "quantity"]
    description: "Non-numeric data in expected numeric field"
    severity: "warn"
  - id: impossible_or_sentinel_date
    column_name_keywords: ["date", "dob", "created", "updated", "time"]
    null_date_sentinels: ["1900-01-01", "1970-01-01", "9999-12-31"]
    accepted_formats: ["%Y-%m-%d", "%m/%d/%Y", "%d/%m/%Y", "%d-%m-%Y"]
    description: "Impossible or sentinel date"
    severity: "warn"
  - id: overloaded_freetext_column
    column_name_keywords: ["notes", "memo", "description", "details"]
    column_name_allowlist: ["notes", "memo", "description", "details"]
    packed_pair_pattern: "[A-Za-z_]+:[A-Za-z0-9_]+"
    description: "Packed key-value pairs in freetext"
    severity: "warn"
  - id: duplicate_key_values
    description: "Duplicate value in declared primary key"
    severity: "block"
  - id: negative_unsigned_field
    column_name_keywords: ["qty", "quantity", "count", "age"]
    description: "Negative value where unsigned is expected"
    severity: "warn"
