[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schemafirst"
version = "2.0.0"
description = "SchemaFirst: Read-only schema auditor, shadow FK inference, and dbt compiler"
authors = [{ name = "Oran McClintock" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
schemafirst = "cli:main"

[tool.setuptools]
py-modules = [
    "cli",
    "profiler",
    "flaw_catalog",
    "codegen",
    "reportgen",
    "seed_dirty_gov_db",
]

[tool.setuptools.data-files]
"share/schemafirst" = ["rules.yaml"]
"share/schemafirst/templates" = [
    "templates/readiness_dossier.html.j2",
    "templates/dbt_staging_model.sql.j2",
    "templates/dbt_schema.yml.j2",
]
