apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crm-data-pvc
  namespace: migration-engine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-dashboard
  namespace: migration-engine
  labels:
    app: crm-dashboard
spec:
  replicas: 1 # Must be 1 because of SQLite file locking
  selector:
    matchLabels:
      app: crm-dashboard
  template:
    metadata:
      labels:
        app: crm-dashboard
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: github-ghcr
      containers:
        - name: crm-ui
          image: ghcr.io/oranmcclintock/crucible-maas-engine-crm:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: crm-data
              mountPath: /app/crm/data
      volumes:
        - name: crm-data
          persistentVolumeClaim:
            claimName: crm-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: crm-dashboard-svc
  namespace: migration-engine
spec:
  selector:
    app: crm-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: ClusterIP
