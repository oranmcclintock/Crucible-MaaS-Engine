apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-engine
  namespace: migration-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: migration-engine
  template:
    metadata:
      labels:
        app: migration-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: engine
          image: migration-engine:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: DB_HOST
              value: "postgres"
