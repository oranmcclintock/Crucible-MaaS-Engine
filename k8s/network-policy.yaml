apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: migration-engine
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crm-ui-policy
  namespace: migration-engine
spec:
  podSelector:
    matchLabels:
      app: crm-dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow all ingress to the Streamlit UI (from Traefik/Ingress)
    - ports:
        - protocol: TCP
          port: 8501
  egress:
    # Allow egress to Postgres
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow egress to internet (HTTPS) for API calls and DNS
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  namespace: migration-engine
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress from CRM UI to Postgres
    - from:
        - podSelector:
            matchLabels:
              app: crm-dashboard
      ports:
        - protocol: TCP
          port: 5432
