# Crucible Engine Configuration
# Pass this file to the executor using: python3 executor.py --config config.yml

databases:
  # The legacy database being migrated (SQLAlchemy URL)
  source: "oracle+oracledb://admin:password@10.0.1.55:1521/?service_name=legacy_prod"
  
  # The Postgres (or SQLite for local testing) database where rotten rows are isolated
  quarantine: "postgresql://admin:password@10.0.2.100:5432/quarantine_db"
  target: "postgresql://admin:password@10.0.3.150:5432/modern_cloud_db"

execution:
  # Path to the directory containing the generated Pydantic modules
  generated_dir: "caseStudy/Chicago_Food_Inspections/generated"
  
  # Path to the load-order blueprint (DAG) generated by the Profiler
  profile_path: "caseStudy/Chicago_Food_Inspections/profile_chicago_food_inspections.json"
  
  # Number of CPU cores to dedicate to the multiprocessing pool. 
  # Set to 'auto' to use all available cores.
  workers: auto
