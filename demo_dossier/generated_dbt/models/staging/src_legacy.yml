      - name: tenancies
        description: "Raw legacy table: tenancies"

      - name: wards
        description: "Raw legacy table: wards"


models:

  - name: stg_case_correspondence
    description: "SchemaFirst sanitized staging model for case_correspondence"
    columns:

      - name: "correspondence_id"
        description: "Target: BIGINT"

        tests:


          - not_null:
              config:
                store_failures: true
                schema: schemafirst_quarantine



          - unique:
              config:
                store_failures: true
                schema: schemafirst_quarantine




      - name: "citizen_id"
        description: "Target: INTEGER"

        tests:


          - relationships:
              to: ref('stg_citizens')
              field: "citizen_id"
              config:
                store_failures: true




      - name: "handled_by_code"
        description: "Target: VARCHAR(255)"

        tests:


          - relationships:
              to: ref('stg_staff')
              field: "staff_code"
              config:
                store_failures: true




      - name: "channel"
        description: "Target: VARCHAR(255)"


      - name: "sent_date"
        description: "Target: DATE"


      - name: "body_text"
        description: "Target: TEXT"



