version: 2

sources:
  - name: legacy_source
    description: "Legacy database tables mirrored via CDC / Full Load"
    tables:

      - name: case_correspondence
        description: "Raw legacy table: case_correspondence"

      - name: citizens
        description: "Raw legacy table: citizens"

      - name: contractors
        description: "Raw legacy table: contractors"

      - name: council_tax_accounts
        description: "Raw legacy table: council_tax_accounts"

      - name: electoral_roll_staging
        description: "Raw legacy table: electoral_roll_staging"

      - name: housing_benefit_claims
